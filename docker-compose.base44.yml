# Base44 sandbox environment for the AstroNiyat Android app (Jetpack Compose + Room + Gemini).
#
# The app is a native Android APK: it cannot run in the browser-based preview
# (the sandbox has no /dev/kvm, so no emulator). This stack therefore builds the
# app from the cloned source and renders its real Compose screens headlessly to
# PNGs, which nginx serves on port 3000 together with the installable APK.
services:

  # Android build toolchain (JDK 21 + Gradle + Android SDK), repository mounted at
  # /workspace. Kept running so builds can be re-run without recreating the stack:
  #   docker compose -f docker-compose.base44.yml exec android gradle :app:assembleDebug
  android:
    build:
      context: .
      dockerfile: .base44/android.Dockerfile
    working_dir: /workspace
    command: ["sh", "-c", "/workspace/.base44/ensure-debug-keystore.sh && exec sleep infinity"]
    environment:
      - BASE44_PREVIEW_MODE
      - GRADLE_USER_HOME=/gradle-home
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - PREVIEW_SCREENSHOT_DIR=/workspace/.base44/preview/screens
    volumes:
      - ./:/workspace
      - gradle-home:/gradle-home
    # Platform-managed secrets (e.g. GEMINI_API_KEY). Optional: the build falls back
    # to the placeholder in .env.example when no value has been provided yet.
    env_file:
      - path: /run/base44/app.env
        required: false
    labels:
      base44.project: "AstroNiyat build toolchain"
      base44.kind: infra
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "gradle --version >/dev/null 2>&1 && test -f /opt/android-sdk/platforms/android-36.1/android.jar || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 20s

  # One-shot: builds the debug APK and re-renders the app screens into
  # .base44/preview/. Re-run it after changing app source:
  #   docker compose -f docker-compose.base44.yml up --force-recreate screenshots
  screenshots:
    build:
      context: .
      dockerfile: .base44/android.Dockerfile
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/.base44/render.sh"]
    environment:
      - BASE44_PREVIEW_MODE
      - GRADLE_USER_HOME=/gradle-home
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - PREVIEW_SCREENSHOT_DIR=/workspace/.base44/preview/screens
    volumes:
      - ./:/workspace
      - gradle-home:/gradle-home
    env_file:
      - path: /run/base44/app.env
        required: false
    labels:
      base44.project: "AstroNiyat screenshots"
      base44.kind: worker
    restart: "no"
    depends_on:
      android:
        condition: service_healthy

  # Web entry point for the preview (host port 3000): the rendered app screens
  # from .base44/preview, regenerated by the `screenshots` service.
  preview:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./.base44/preview:/usr/share/nginx/html:ro
    labels:
      base44.project: "AstroNiyat preview"
      base44.kind: web
      base44.port: 3000
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  gradle-home:
